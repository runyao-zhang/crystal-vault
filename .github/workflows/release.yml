# 打一个 tag 就出一次发布。
#
# ⚠️ **tag 必须和 `manifest.json` 里的 `version` 逐字一致，而且不带 `v` 前缀。**
#    写 `v1.0.0` 的话 Obsidian 找不到这个版本、用户永远收不到更新——
#    而 GitHub 那边一切正常，看不出任何问题。下面第一个 step 专门挡它。
#
# 产物三份，**逐个当附件传**（不是塞进 zip）：main.js / manifest.json / styles.css。
# Obsidian 是按 release 的附件去取的，打包成压缩包它读不到。

name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  # 下面那一步「构建来源证明」要用的两个权限。
  # `id-token` 给它签名的身份，`attestations` 让它把记录写进仓库。
  # 少任何一个，那一步会直接失败——而失败信息是「permissions」，
  # 看着像仓库设置的问题，其实只是这里少一行。
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Tag 必须和 manifest 的 version 一致
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$VER" ]; then
            echo "tag 是 '$TAG'，而 manifest.json 里写的是 '$VER' —— 必须逐字一致、且不带 v 前缀"
            exit 1
          fi
          echo "tag 与 manifest 一致：$TAG"

      - run: npm ci

      - run: npm run build

      - name: 确认三份产物都在
        run: |
          for f in main.js manifest.json styles.css; do
            test -f "$f" || { echo "缺 $f"; exit 1; }
          done

      # ---- 构建来源证明（artifact attestation）----
      #
      # 给三份产物签一张「这个文件确实是从这个仓库的这次提交、由这条 workflow
      # 构建出来的」的证明。用户可以拿 GitHub CLI 验：
      #
      #     gh attestation verify main.js --repo runyao-zhang/crystal-vault
      #
      # 为什么值得做：插件是**下载下来直接在你库里跑**的东西，而 release 附件
      # 在原理上是可以被换掉的。有了证明，「我下到的这份和源码对得上」
      # 就不再需要用户信任谁。社区目录的自动审查也会看这一项。
      - name: 给产物出构建来源证明
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "${GITHUB_REF#refs/tags/}" \
            --generate-notes \
            main.js manifest.json styles.css
